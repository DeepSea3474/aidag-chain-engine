<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ask KUBRA — Free, Sovereign AI</title>
<style>
  :root { --bg:#0b0e14; --card:#141a24; --ink:#e8ecf3; --dim:#93a1b3; --acc:#3ddc97; --acc2:#5b8cff; --line:#25303f; }
  * { box-sizing:border-box; }
  body { margin:0; font:16px/1.6 system-ui,-apple-system,Segoe UI,Roboto,sans-serif; background:var(--bg); color:var(--ink); }
  .wrap { max-width:720px; margin:0 auto; padding:24px 16px 60px; }
  .top { display:flex; justify-content:space-between; align-items:center; gap:10px; }
  .brand { display:flex; align-items:center; gap:12px; }
  .logo { height:44px; width:auto; border-radius:8px; }
  h1 { font-size:1.5rem; margin:.2em 0; }
  .sub { color:var(--dim); margin-top:0; }
  .lang { display:flex; gap:4px; background:#0f1620; border:1px solid var(--line); border-radius:999px; padding:3px; }
  .lang button { border:0; background:transparent; color:var(--dim); padding:5px 12px; border-radius:999px; cursor:pointer; font-weight:600; font-size:.85rem; }
  .lang button.sel { background:var(--acc2); color:#04102b; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:14px; padding:16px; margin:16px 0; }
  #konusma { display:flex; flex-direction:column; gap:12px; min-height:120px; }
  .msg { padding:12px 14px; border-radius:12px; max-width:88%; white-space:pre-wrap; }
  .soru { align-self:flex-end; background:#1c2740; border:1px solid #2b3a5c; }
  .cevap { align-self:flex-start; background:#0f1620; border:1px solid var(--line); }
  .cevap .src { color:var(--dim); font-size:.78rem; margin-top:6px; }
  .think { color:var(--acc); font-size:.9rem; }
  .inrow { display:flex; gap:10px; margin-top:6px; }
  input[type=text] { flex:1; padding:13px; border-radius:10px; border:1px solid var(--line); background:#0f1620; color:var(--ink); font-size:1rem; }
  .btn { border:0; border-radius:12px; padding:13px 22px; font-size:1rem; font-weight:600; cursor:pointer; background:var(--acc); color:#04120b; }
  .btn:disabled { opacity:.5; cursor:not-allowed; }
  a { color:var(--acc2); }
  .note { color:var(--dim); font-size:.88rem; }
  .cta { background:linear-gradient(90deg,#0f2033,#122a1f); border:1px solid #26463a; }
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <div class="brand">
      <img src="/aidag-logo.jpg" alt="AIDAG / KUBRA" class="logo" onerror="this.style.display='none'">
      <h1>💬 <span data-i="title">Ask KUBRA</span></h1>
    </div>
    <div class="lang">
      <button id="en" class="sel" onclick="setLang('en')">EN</button>
      <button id="tr" onclick="setLang('tr')">TR</button>
    </div>
  </div>
  <p class="sub" data-i="sub"></p>

  <div class="card">
    <div id="konusma"></div>
    <div class="inrow">
      <input id="soru" type="text" data-i-ph="ph" autocomplete="off">
      <button id="sor" class="btn" data-i="ask"></button>
    </div>
    <p class="note" data-i="speed" style="margin:10px 0 0"></p>
  </div>

  <div class="card cta">
    <b data-i="ctaTitle"></b>
    <p class="note" data-i="ctaText" style="margin:6px 0 10px"></p>
    <a href="/katil" class="btn" style="text-decoration:none;display:inline-block" data-i="ctaBtn"></a>
  </div>

  <p class="note" data-i="foot"></p>
</div>

<script>
const I18N = {
  en: {
    title:"Ask KUBRA", sub:"A free, sovereign, open AI — owned by the people who build it, not a corporation.",
    ph:"Ask anything…", ask:"Ask",
    speed:"⚠️ KUBRA runs on donated compute (CPU for now) — answers can take a minute. The more people contribute GPUs, the faster it gets.",
    ctaTitle:"⚡ Make KUBRA faster & smarter", ctaText:"Contribute your browser's spare power and earn AIDAG LSC. No install.",
    ctaBtn:"Contribute →",
    foot:"Every answer is grounded (from sources, no hallucination) and written to a public chain. Open, verifiable, yours.",
    thinking:"KUBRA is thinking… (verified by the network)", srcs:s=>"sources: "+s,
    err:"Something went wrong. Please try again.", empty:"Type a question first.",
    noanswer:"No answer yet — the network may be low on contributors. Try again, or contribute to help.",
    genOpen:"Sure — I can create that for you. Type what you want and press Generate:",
    genPh:"e.g. a funny cat with sunglasses, cartoon", genBtn:"Generate", genThink:"KUBRA is creating…",
    genWarn:"⚠️ AI-generated & public. It may be misused; I never depict anyone without consent. Ownership is recorded on-chain.",
    genCert:"📜 Provenance:", genVerify:"verify on-chain", genDl:"Download",
    genConsent:"I read and accept the warning. Download?",
    genStudio:"🎨 Open Image Studio →", genOr:"…or generate right here:",
    genStudio2:"🎨 Create Content →",
  },
  tr: {
    title:"KUBRA'ya Sor", sub:"Ücretsiz, egemen, açık bir yapay zeka — şirketlerin değil, onu inşa edenlerin.",
    ph:"Ne istersen sor…", ask:"Sor",
    speed:"⚠️ KUBRA bağışlanan güçte çalışır (şimdilik CPU) — cevaplar bir dakika sürebilir. Ne kadar çok GPU katkısı olursa o kadar hızlanır.",
    ctaTitle:"⚡ KUBRA'yı hızlandır & güçlendir", ctaText:"Tarayıcının boştaki gücünü ver, AIDAG LSC kazan. Kurulum yok.",
    ctaBtn:"Katkı Ver →",
    foot:"Her cevap kaynağa dayanır (uydurma yok) ve halka açık zincire yazılır. Açık, doğrulanabilir, senin.",
    thinking:"KUBRA düşünüyor… (ağ tarafından doğrulanıyor)", srcs:s=>"kaynaklar: "+s,
    err:"Bir şeyler ters gitti. Tekrar dene.", empty:"Önce bir soru yaz.",
    noanswer:"Henüz cevap yok — ağda katkıcı az olabilir. Tekrar dene ya da katkı vererek yardım et.",
    genOpen:"Tabii — senin için üretebilirim. Ne istediğini yaz ve Üret'e bas:",
    genPh:"örn: güneş gözlüklü komik bir kedi, çizgi film", genBtn:"Üret", genThink:"KUBRA üretiyor…",
    genWarn:"⚠️ AI üretimi ve herkese açık. Kötüye kullanılabilir; kimseyi rızasız tasvir etmem. Sahiplik zincirde kayıtlı.",
    genCert:"📜 Köken belgesi:", genVerify:"zincirde doğrula", genDl:"İndir",
    genConsent:"Uyarıyı okudum ve kabul ediyorum. İndirilsin mi?",
    genStudio:"🎨 Görsel Stüdyo'yu Aç →", genOr:"…ya da hemen burada üret:",
    genStudio2:"🎨 İçerik Oluştur →",
  }
};
let L = localStorage.getItem("kubra_lang") || "en";
const t = k => (I18N[L][k] ?? I18N.en[k]);
function setLang(lang){
  L=lang; localStorage.setItem("kubra_lang",lang); document.documentElement.lang=lang;
  en.classList.toggle("sel",lang==="en"); tr.classList.toggle("sel",lang==="tr");
  document.querySelectorAll("[data-i]").forEach(el=>{const v=t(el.dataset.i); if(typeof v==="string") el.textContent=v;});
  document.querySelectorAll("[data-i-ph]").forEach(el=>{const v=t(el.dataset.iPh); if(typeof v==="string") el.placeholder=v;});
}

const COORD = window.KUBRA_COORD || "https://aidag-chain.com/kubra-api";
const BRAIN = window.KUBRA_BRAIN || "https://aidag-chain.com/kubra-brain";
const $ = id => document.getElementById(id);
const konusma = $("konusma");
function ekle(cls, txt){ const d=document.createElement("div"); d.className="msg "+cls; d.textContent=txt; konusma.appendChild(d); konusma.scrollTop=konusma.scrollHeight; return d; }
// Cevaptaki URL/yolları tıklanabilir linke çevir (güvenli: önce HTML kaçışı)
function esc(s){ return s.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;"); }
function linkify(txt){
  let s = esc(txt);
  s = s.replace(/\[([^\]]+)\]\((https?:\/\/[^\s)]+)\)/g,'<a href="$2" target="_blank">$1</a>'); // markdown
  s = s.replace(/(^|[^"=\/])((https?:\/\/)[^\s<)]+)/g,'$1<a href="$2" target="_blank">$2</a>');   // düz URL
  s = s.replace(/(^|[\s(>])((?:www\.)?aidag-chain\.com\/[a-zA-Z]+)/g,'$1<a href="https://$2" target="_blank">$2</a>'); // protokolsüz
  return s;
}

async function j(path, opt){ const r = await fetch(COORD+path, opt); return r.json(); }

// Görsel/içerik üretim isteği mi?
function gorselIstegi(q){
  // Türkçe normalize: İ→i, ü→u, ç→c, ş→s, ğ→g, ö→o, ı→i (aksan/nokta temizle)
  const s = q.toLowerCase().normalize("NFKD").replace(/[̀-ͯ]/g,"").replace(/ı/g,"i");
  const kelimeler = ["gorsel","resim","resmi","resmin","ciz","cizim","fotograf","foto","image",
    "picture","draw","illustr","logo","afis","poster","tasarla","tasarim","icerik uret",
    "icerik olustur","icerik uretici","uretici","uret misin","uretir misin","resim yap","gorsel yap",
    "cizer misin","cizebilir","bana bir resim","bana bir gorsel","studyo","uretecini","uretici ac"];
  return kelimeler.some(k=>s.includes(k));
}

// Sohbette INLINE görsel üretim paneli (link yok, burada üretir)
function gorselPaneli(prefill){
  const d = ekle("cevap",""); d.innerHTML="";
  const p = document.createElement("div"); p.textContent = t("genOpen"); d.appendChild(p);
  const link = document.createElement("a");
  link.href="/gorsel"; link.className="btn";
  link.style.cssText="text-decoration:none;display:inline-block;margin:10px 0 4px;background:var(--acc2);color:#04102b";
  link.textContent = t("genStudio"); d.appendChild(link);
  const orp = document.createElement("div"); orp.className="note"; orp.style.margin="6px 0 2px"; orp.textContent = t("genOr"); d.appendChild(orp);
  const row = document.createElement("div"); row.className="inrow";
  const inp = document.createElement("input"); inp.type="text"; inp.value = prefill||""; inp.placeholder = t("genPh");
  const b = document.createElement("button"); b.className="btn"; b.textContent = t("genBtn");
  row.appendChild(inp); row.appendChild(b); d.appendChild(row);
  const out = document.createElement("div"); out.style.marginTop="10px"; d.appendChild(out);
  async function uret(){
    const prompt = inp.value.trim(); if(!prompt){ inp.focus(); return; }
    b.disabled=true; out.innerHTML='<span class="think">'+t("genThink")+'</span>';
    try{
      const r = await fetch(BRAIN+"/v1/image",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({prompt})});
      if(!r.ok){ const m=(await r.text().catch(()=>""))||("HTTP "+r.status); out.innerHTML='<div style="color:#ff8a6a">🚫 '+m+'</div>'; b.disabled=false; return; }
      const verify = r.headers.get("x-kubra-verify")||"";
      const url = URL.createObjectURL(await r.blob());
      out.innerHTML="";
      const img=new Image(); img.src=url; img.style.maxWidth="100%"; img.style.borderRadius="10px"; img.style.display="block"; out.appendChild(img);
      const w=document.createElement("div"); w.className="src"; w.style.color="#ffd48a"; w.textContent=t("genWarn"); out.appendChild(w);
      if(verify){ const c=document.createElement("div"); c.className="src"; c.innerHTML=t("genCert")+' <a href="'+verify+'" target="_blank">'+t("genVerify")+'</a>'; out.appendChild(c); }
      const dl=document.createElement("button"); dl.className="btn"; dl.style.marginTop="8px"; dl.textContent="⬇ "+t("genDl");
      dl.onclick=()=>{ if(!confirm(t("genConsent"))) return; const a=document.createElement("a"); a.href=url; a.download="kubra-gorsel.png"; document.body.appendChild(a); a.click(); a.remove(); };
      out.appendChild(dl);
    }catch(e){ out.innerHTML='<div style="color:#ff8a6a">'+t("err")+'</div>'; }
    b.disabled=false; konusma.scrollTop=konusma.scrollHeight;
  }
  b.onclick=uret; inp.addEventListener("keydown",e=>{ if(e.key==="Enter") uret(); });
  konusma.scrollTop=konusma.scrollHeight; inp.focus();
}

async function sor(){
  const q = $("soru").value.trim();
  if(!q){ return; }
  $("soru").value=""; ekle("soru", q);
  if(gorselIstegi(q)){ gorselPaneli(q); $("soru").focus(); return; }
  $("sor").disabled=true;
  const bekle = ekle("cevap", ""); bekle.innerHTML = '<span class="think">'+t("thinking")+'</span>';
  try {
    const c = await j("/job/create", { method:"POST", headers:{"Content-Type":"application/json"}, body: JSON.stringify({ prompt:q, deterministic:true }) });
    if(!c.job_id) throw new Error("job");
    // async yokla: doğrulanmış cevabı bekle (Cloudflare-güvenli, kısa istekler)
    let tries=0, ans=null;
    while(tries++ < 120){
      await new Promise(r=>setTimeout(r,3000));
      const s = await j("/job/"+c.job_id);
      if(s.ok && s.job && s.job.status==="verified"){ ans = s.job.verified_answer; break; }
    }
    if(ans){
      bekle.innerHTML = linkify(ans);
      // KUBRA görsel/stüdyodan bahsettiyse → tıklanır "İçerik Oluştur →" butonu ekle
      const nn = ans.toLowerCase().normalize("NFKD").replace(/[̀-ͯ]/g,"").replace(/ı/g,"i");
      if(nn.includes("gorsel")||nn.includes("studyo")||nn.includes("resim uret")||nn.includes("/gorsel")){
        const b2=document.createElement("a"); b2.href="/gorsel"; b2.className="btn";
        b2.style.cssText="text-decoration:none;display:block;margin-top:12px;text-align:center;background:var(--acc2);color:#04102b";
        b2.textContent=t("genStudio2"); bekle.appendChild(b2);
      }
    }
    else { bekle.innerHTML='<span class="think">'+t("noanswer")+'</span>'; }
  } catch(e){ bekle.textContent = t("err"); }
  $("sor").disabled=false; $("soru").focus();
}
$("sor").onclick = sor;
$("soru").addEventListener("keydown", e=>{ if(e.key==="Enter") sor(); });
setLang(L);
</script>
</body>
</html>
