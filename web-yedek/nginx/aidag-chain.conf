server {
    listen 80;
    server_name aidag-chain.com www.aidag-chain.com;

    # Belge dogrulama sayfasi
    location = /belge {
        alias /var/www/aidag/belge-dogrulama.html;
        default_type text/html;
    }

    # KUBRA sohbet sayfasi
    location = /ask {
        alias /var/www/aidag/ask.html;
        default_type text/html;
    }

    # Kutuphaneler (blake3, nacl, qrcode)
    location /lib/ {
        alias /var/www/aidag/lib/;
    }

    # Node RPC (belge dogrulama /submit, /belge/:hash icin) - 8645
    location /rpc/ {
        proxy_pass http://127.0.0.1:8645/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        add_header 'Access-Control-Allow-Origin' '*' always;
        add_header 'Access-Control-Allow-Methods' 'GET, POST, OPTIONS' always;
        add_header 'Access-Control-Allow-Headers' '*' always;
        if ($request_method = 'OPTIONS') { return 204; }
    }

    # KUBRA beyin API
    location /kubra-brain/ {
        proxy_pass http://127.0.0.1:8646/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        add_header 'Access-Control-Allow-Origin' '*' always;
        add_header 'Access-Control-Allow-Methods' 'GET, POST, OPTIONS' always;
        add_header 'Access-Control-Allow-Headers' '*' always;
        if ($request_method = 'OPTIONS') { return 204; }
    }


    # Statik KUBRA/site sayfalari
    location = /katil {
        alias /var/www/aidag/katil.html;
        default_type text/html;
    }
    location = /gorsel {
        alias /var/www/aidag/gorsel.html;
        default_type text/html;
    }
    location = /how {
        alias /var/www/aidag/how.html;
        default_type text/html;
    }
    location = /kit {
        alias /var/www/aidag/kit.html;
        default_type text/html;
    }
    location = /cuzdan {
        alias /var/www/aidag/cuzdan.html;
        default_type text/html;
    }

    # KUBRA koordinator API (job/create - ask sayfasi buraya sorar)
    location /kubra-api/ {
        proxy_pass http://127.0.0.1:8647/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_read_timeout 120s;
        add_header 'Access-Control-Allow-Origin' '*' always;
        add_header 'Access-Control-Allow-Methods' 'GET, POST, OPTIONS' always;
        add_header 'Access-Control-Allow-Headers' '*' always;
        if ($request_method = 'OPTIONS') { return 204; }
    }

    location = /ask-stream {
        alias /var/www/aidag/ask-stream.html;
        default_type text/html;
    }

    location = /komutlar {
        alias /var/www/aidag/komutlar.html;
        default_type text/html;
    }

    # Ana site (Next.js)
    location / {
        proxy_pass http://localhost:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        add_header 'Access-Control-Allow-Origin' '*' always;
        add_header 'Access-Control-Allow-Methods' 'GET, POST, OPTIONS' always;
        add_header 'Access-Control-Allow-Headers' 'DNT,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,Range,Authorization' always;
    }
}
