<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>KUBRA — Announcement Kit</title>
<style>
  :root{--bg:#0b0e14;--card:#141a24;--ink:#e8ecf3;--dim:#93a1b3;--acc:#3ddc97;--line:#25303f;}
  *{box-sizing:border-box}
  body{margin:0;font:16px/1.6 system-ui,Segoe UI,Roboto,sans-serif;background:var(--bg);color:var(--ink)}
  .wrap{max-width:720px;margin:0 auto;padding:24px 16px 60px}
  h1{font-size:1.4rem} h2{font-size:1.05rem;margin:22px 0 8px}
  .note{color:var(--dim);font-size:.9rem}
  .box{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px;margin:8px 0}
  textarea{width:100%;min-height:150px;background:#0f1620;color:var(--ink);border:1px solid var(--line);border-radius:10px;padding:12px;font:14px/1.5 ui-monospace,Menlo,monospace;resize:vertical}
  .btn{border:0;border-radius:10px;padding:10px 18px;font-weight:700;cursor:pointer;background:var(--acc);color:#04120b;margin-top:8px}
  .ok{color:var(--acc);font-weight:700;margin-left:10px}
  a{color:#5b8cff}
</style>
</head>
<body>
<div class="wrap">
  <h1>📣 KUBRA — Announcement Kit</h1>
  <p class="note">Her kutunun altındaki <b>Kopyala</b> butonuna bas → metnin <b>tamamı</b> panoya alınır → X / LinkedIn'e yapıştır. Görsel: <a href="/how" target="_blank">aidag-chain.com/how</a> (flywheel — ekran görüntüsü al ya da link ver).</p>

  <h2>🐦 X — single post</h2>
  <div class="box"><textarea id="x1" readonly></textarea><button class="btn" onclick="kopya('x1',this)">Kopyala</button></div>

  <h2>🧵 X — thread (tümü)</h2>
  <div class="box"><textarea id="x2" readonly style="min-height:340px"></textarea><button class="btn" onclick="kopya('x2',this)">Kopyala</button></div>

  <h2>💼 LinkedIn</h2>
  <div class="box"><textarea id="li" readonly style="min-height:300px"></textarea><button class="btn" onclick="kopya('li',this)">Kopyala</button></div>
</div>
<script>
const X1 = `Meet KUBRA — the AI assistant of AIDAG-Chain.

💬 Free to use: aidag-chain.com/ask
📚 Answers from verified sources — says "no verified information" instead of guessing
⛓️ A hash of every answer is written to the chain
⚡ Pilot: contribute spare compute, earn $LSC

Honest status: small model on the project's own server (CPU). Early — and we won't pretend otherwise.

👉 aidag-chain.com/how`;

const X2 = `1/ KUBRA is the AI assistant of AIDAG-Chain — an independent Layer-1 DAG blockchain, live on mainnet since 26 July 2026.

2/ What works today
• Free to use at aidag-chain.com/ask
• Grounded in verified official sources; says "no verified information" instead of guessing
• Verifies document hashes against the chain
• Writes a hash of every answer to the chain

3/ The pilot
🖥️ Contribute idle compute → help run KUBRA
💰 Earn $LSC (AIDAG-Chain's gas coin) — rewards are settled by the team during the pilot

4/ The plan (not live yet)
🤖 Pay for KUBRA usage in $LSC
💧 Usage fees fund contributor rewards
📈 More contributors → a stronger KUBRA

5/ Honest about where we are
Today KUBRA runs a small model on the project's own server (CPU). Good on basics, not frontier-level. Independent security audit of the chain: pending.

6/ Try it
💬 aidag-chain.com/ask
⚡ Pilot: aidag-chain.com/katil`;

const LI = `KUBRA is the AI assistant of AIDAG-Chain, an independent Layer-1 DAG blockchain written in Rust and live on mainnet since 26 July 2026.

What works today: KUBRA is free to use, answers from verified official sources (and says "no verified information" instead of guessing), verifies document hashes against the chain, and writes a hash of every answer to the chain.

The pilot: people can contribute idle compute and earn LSC, the chain's gas coin; during the pilot, rewards are settled by the team.

The plan (not live yet): usage paid in LSC, with those fees funding contributor rewards.

We're honest about the stage: KUBRA runs a small model on the project's own server (CPU) today — competitive on basics, not frontier-level. The chain's independent security audit is pending.

See how it works: aidag-chain.com/how
Try it: aidag-chain.com/ask`;

document.getElementById("x1").value=X1;
document.getElementById("x2").value=X2;
document.getElementById("li").value=LI;
async function kopya(id,btn){
  const el=document.getElementById(id);
  try{ await navigator.clipboard.writeText(el.value); }
  catch(e){ el.select(); document.execCommand("copy"); }
  const s=document.createElement("span"); s.className="ok"; s.textContent="✓ kopyalandı"; btn.after(s); setTimeout(()=>s.remove(),1800);
}
</script>
</body>
</html>
