[package]
name = "soulware-worker"
version = "0.1.0"
edition = "2021"
license = "BUSL-1.1"
publish = false
description = "SoulwareAI worker — indirilen KUBRA istemcisi. Kullanici IZNIYLE bostaki gucu aga verir."

[[bin]]
name = "soulware-worker"
path = "src/main.rs"

[dependencies]
lsc-engine = { path = "../lsc-engine" }
ed25519-dalek = { version = "=2.1.1", default-features = false, features = ["std"] }
hex = "=0.4.3"
rand = "=0.8.5"
tokio = { version = "=1.53.1", features = ["rt-multi-thread", "macros", "signal", "time"] }
serde_json = "=1.0.151"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
