name: codeql
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  schedule:
    - cron: "31 3 * * 1"  # haftalık (Pazartesi 03:31 UTC)

permissions:
  contents: read
  security-events: write

jobs:
  analyze:
    name: CodeQL (Rust)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: CodeQL init
        uses: github/codeql-action/init@v3
        with:
          # CodeQL Rust desteği (2025 GA). Runner/dil desteklemezse bu iş kırmızı verir → o durumda
          # bu workflow kaldırılır ve clippy + cargo audit/deny ile statik kapsama korunur.
          languages: rust
      - name: CodeQL autobuild
        uses: github/codeql-action/autobuild@v3
      - name: CodeQL analyze
        uses: github/codeql-action/analyze@v3
