# AIDAG-Chain / LSC — Surekli Entegrasyon (CI)
#
# Her push ve pull request'te calisir. Kapilar (hepsi gecmek ZORUNDA):
#   1) Bicim   — cargo fmt --check
#   2) Lint    — cargo clippy -D warnings
#   3) Test    — cargo test (tum birim + entegrasyon)
#   4) Audit   — cargo audit (RUSTSEC guvenlik acigi DB'si)
#   5) Deny    — cargo deny check (lisans + kaynak + advisories)
#
# Herhangi biri kirmizi yanarsa PR birlesemez (branch protection ile birlikte).

name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  quality:
    name: Bicim + Lint + Test
    runs-on: ubuntu-latest
    steps:
      - name: Kodu checkout et
        uses: actions/checkout@v7

      - name: Rust toolchain (stable + rustfmt + clippy)
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Bagimliliklari cache'le (hizli kosma)
        uses: Swatinem/rust-cache@v2

      - name: 1) Bicim kontrolu (cargo fmt --check)
        run: cargo fmt --all -- --check

      - name: 2) Lint (cargo clippy, uyari = hata)
        # --all-features KULLANMA: 'cuda' feature'ı nvcc/GPU ister (CI runner'ında yok). Varsayılan (CPU) feature'larla lint.
        run: cargo clippy --all-targets -- -D warnings

      - name: 3) Testler (cargo test)
        # Birim + izole. Model/GPU gerektiren kor/eval CI'da KOSMAZ (deploy kilidi test-kaydet.sh'te olculur).
        run: cargo test --all --verbose

  audit:
    name: 4) cargo audit (RUSTSEC)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Güvenlik istisnası süresi kontrolü (dolduysa CI kırmızı)
        run: bash deploy/guvenlik-istisna-suresi.sh
      - name: cargo-audit kur
        run: cargo install cargo-audit --locked
      - name: cargo audit (gerekçeli istisnalarla — .cargo/audit.toml)
        run: cargo audit

  deny:
    name: 5) cargo deny (lisans + kaynak + advisories)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Lisans + kaynak + advisory denetimi
        uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check
