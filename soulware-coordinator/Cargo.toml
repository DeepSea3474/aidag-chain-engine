[package]
name = "soulware-coordinator"
version = "0.1.0"
edition = "2021"
description = "SoulwareAI hesaplama & odul koordinatoru — is dagit, yedekli dogrula, zincire imzali odul yaz."

[[bin]]
name = "soulware-coordinator"
path = "src/main.rs"

[dependencies]
lsc-engine = { path = "../lsc-engine" }
ed25519-dalek = { version = "=2.1.1", default-features = false, features = ["std"] }
blake3 = "=1.5.5"
hex = "=0.4.3"
rand = "=0.8.5"
axum = "=0.7.9"
# Tarayici katki sayfasi koordinatore ulasabilsin (CORS). Sifir-kurulum icin sart.
tower-http = { version = "=0.5.2", features = ["cors"] }
tokio = { version = "=1.43.0", features = ["rt-multi-thread", "macros", "signal", "net", "time", "sync"] }
serde = { version = "1", features = ["derive"] }
serde_json = "=1.0.140"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
